<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/regis.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Register</title>
</head>

<body>
    <i class="fa-solid fa-circle-user"></i>
    <h2>Register</h2>
    <form action="Activity_FIET_Webpage.html" onsubmit="submitForm(event)">

        <div class="input_box">
            <i class="fa-solid fa-id-card"></i>
            <input type="text" id="id_card" inputmode="numeric" maxlength="17" placeholder="รหัสนักศึกษา/อาจารย์" required
                oninvalid="this.setCustomValidity('กรุณากรอกรหัสนักศึกษา/อาจารย์')"
                oninput="this.setCustomValidity(''); formatIDCard(this)">
        </div>

        <div class="input_box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="รหัสผ่าน" required
                oninvalid="this.setCustomValidity('กรุณากรอกรหัสผ่าน')"
                oninput="this.setCustomValidity('')">
        </div>

        <div class="input_box">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="thai_first_name" placeholder="ชื่อ" pattern="^[ก-๙]+$" required
                oninvalid="this.setCustomValidity(this.value ?  'กรุณากรอกเป็นภาษาไทยเท่านั้น' : 'กรุณากรอกชื่อ')"
                oninput="this.setCustomValidity('')">
            <input type="text" id="thai_last_name" placeholder="นามสกุล" pattern="^[ก-๙]+$" required
                oninvalid="this.setCustomValidity(this.value ?  'กรุณากรอกเป็นภาษาไทยเท่านั้น' : 'กรุณากรอกนามสกุล')"
                oninput="this.setCustomValidity('')">
        </div>

        <div class="checklist-dropdown" id="positionDropdown">
            <button type="button" class="checklist-trigger" onclick="toggleSingleDropdown('positionPanel', 'positionChevron', 'positionDropdown')">
                <div style="display: flex; align-items: center;">
                    <i class="fa-solid fa-thumbtack left-icon"></i>
                    <span id="positionTriggerText">ตำแหน่ง</span>
                </div>
                <i class='fa-solid fa-chevron-down chevron' id="positionChevron"></i>
            </button>
            <div class="checklist-panel" id="positionPanel">
                <label class="checklist-item">
                    <input type="radio" name="position_radio" value="TA" onchange="selectDropdownItem(this, 'positionTriggerText', 'positionDropdown', 'position')">
                    <span>TA</span>
                </label>
                <label class="checklist-item">
                    <input type="radio" name="position_radio" value="Teacher" onchange="selectDropdownItem(this, 'positionTriggerText', 'positionDropdown', 'position')">
                    <span>อาจารย์</span>
                </label>
            </div>
            <select id="position" required style="display: none;" oninvalid="this.setCustomValidity('กรุณาเลือกตำแหน่ง')" oninput="this.setCustomValidity('')">
                <option value="" disabled selected hidden>ตำแหน่ง</option>
                <option value="TA">TA</option>
                <option value="Teacher">อาจารย์</option>
            </select>
        </div>

        <div class="checklist-dropdown" id="majorDropdown">
            <button type="button" class="checklist-trigger" onclick="toggleSingleDropdown('majorPanel', 'majorChevron', 'majorDropdown')">
                <div style="display: flex; align-items: center;">
                    <i class="fa-solid fa-microscope left-icon"></i>
                    <span id="majorTriggerText">สาขาภาควิชา</span>
                </div>
                <i class='fa-solid fa-chevron-down chevron' id="majorChevron"></i>
            </button>
            <div class="checklist-panel" id="majorPanel">
                <label class="checklist-item">
                    <input type="radio" name="major_radio" value="MTE" onchange="selectDropdownItem(this, 'majorTriggerText', 'majorDropdown', 'major')">
                    <span>MTE (ครุศาสตร์เครื่องกล)</span>
                </label>
                <label class="checklist-item">
                    <input type="radio" name="major_radio" value="CTE" onchange="selectDropdownItem(this, 'majorTriggerText', 'majorDropdown', 'major')">
                    <span>CTE (ครุศาสตร์โยธา)</span>
                </label>
                <label class="checklist-item">
                    <input type="radio" name="major_radio" value="ETE" onchange="selectDropdownItem(this, 'majorTriggerText', 'majorDropdown', 'major')">
                    <span>ETE (ครุศาสตร์ไฟฟ้า)</span>
                </label>
                <label class="checklist-item">
                    <input type="radio" name="major_radio" value="PTE" onchange="selectDropdownItem(this, 'majorTriggerText', 'majorDropdown', 'major')">
                    <span>PTE (ครุศาสตร์อุตสาหการ)</span>
                </label>
                <label class="checklist-item">
                    <input type="radio" name="major_radio" value="ECT" onchange="selectDropdownItem(this, 'majorTriggerText', 'majorDropdown', 'major')">
                    <span>ECT (เทคโนโลยีการศึกษาและสื่อสารมวลชน)</span>
                </label>
                <label class="checklist-item">
                    <input type="radio" name="major_radio" value="PPT" onchange="selectDropdownItem(this, 'majorTriggerText', 'majorDropdown', 'major')">
                    <span>PPT (เทคโนโลยีการพิมพ์และบรรจุภัณฑ์)</span>
                </label>
                <label class="checklist-item">
                    <input type="radio" name="major_radio" value="CMM" onchange="selectDropdownItem(this, 'majorTriggerText', 'majorDropdown', 'major')">
                    <span>CMM (วิทยาการคอมพิวเตอร์ประยุกต์-มัลติมีเดีย)</span>
                </label>
            </div>
            <select id="major" required style="display: none;" oninvalid="this.setCustomValidity('กรุณาเลือกสาขาภาควิชา')" oninput="this.setCustomValidity('')">
                <option value="" disabled selected hidden>สาขาภาควิชา</option>
                <option value="MTE">MTE (ครุศาสตร์เครื่องกล)</option>
                <option value="CTE">CTE (ครุศาสตร์โยธา)</option>
                <option value="ETE">ETE (ครุศาสตร์ไฟฟ้า)</option>
                <option value="PTE">PTE (ครุศาสตร์อุตสาหการ)</option>
                <option value="ECT">ECT (เทคโนโลยีการศึกษาและสื่อสารมวลชน)</option>
                <option value="PPT">PPT (เทคโนโลยีการพิมพ์และบรรจุภัณฑ์)</option>
                <option value="CMM">CMM (วิทยาการคอมพิวเตอร์ประยุกต์-มัลติมีเดีย)</option>
            </select>
        </div>

        <div class="input_box">
            <i class="fa-solid fa-cake-candles"></i>
            <input type="text" id="birthday" placeholder="วัน/เดือน/ปีเกิด" onfocus="(this.type='date')" onblur="(this.type='text')" required
                oninvalid="this.setCustomValidity('กรุณากรอกวัน/เดือน/ปีเกิด')"
                oninput="this.setCustomValidity(''); this.setCustomValidity('')">

        </div>

        <div class="input_box">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="Email" required oninvalid="this.setCustomValidity('กรุณากรอก Email')"
                oninput="this.setCustomValidity('')">
        </div>

        <div class="input_box">
            <i class="fa-solid fa-phone"></i>
            <input type="tel" id="telephone" inputmode="numeric" maxlength="12" placeholder="เบอร์โทรศัพท์" required
                oninvalid="this.setCustomValidity('กรุณากรอกเบอร์โทรศัพท์')"
                oninput="this.setCustomValidity(''); formatPhoneNumber(this)">
        </div>

        <div class="upload-box-container">
            <label class="upload-box" for="profile_picture" id="uploadBox">
                <input type="file" id="profile_picture" accept="image/*" required
                    oninvalid="this.setCustomValidity('กรุณาอัปโหลดรูปภาพโปรไฟล์')"
                    oninput="this.setCustomValidity(''); updateFileName(this)">
                <div id="uploadPlaceholder">
                    <i class="fa-solid fa-image"></i>
                    <p id="uploadText">คลิกเพื่ออัปโหลดรูปภาพโปรไฟล์</p>
                    <span>PNG, JPG, WEBP สูงสุด 5MB</span>
                </div>
                <img id="imagePreview" src="" alt="Image Preview" style="display: none; max-width: 100%; max-height: 100%; border-radius: 8px; margin: 0 auto; object-fit: contain;">
            </label>
        </div>

        <button type="submit" style="margin-top: 20px;">ยืนยัน</button>

        <h5>มีบัญชีอยู่แล้ว ? <a href="#" onclick="goLogin(event)">เข้าสู่ระบบ</a></h5>
    </form>

    <script src="/Js/script.js"></script>
</body>

</html>
